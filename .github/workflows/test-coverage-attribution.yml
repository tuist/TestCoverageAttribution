name: TestCoverageAttribution

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-coverage-attribution-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The macOS jobs run on Tuist Runners. The `tuist-macos-26-3` profile selects Xcode 26.3 (see
# .xcode-version), so no job switches Xcode itself.
jobs:
  build:
    name: "Release build on macOS"
    runs-on: tuist-macos-26-3
    if: github.repository == 'tuist/TestCoverageAttribution'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.1
      - run: mise run build

  test:
    name: "Test on macOS"
    runs-on: tuist-macos-26-3
    if: github.repository == 'tuist/TestCoverageAttribution'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.1
      - run: mise run test

  test-linux:
    name: "Test on Linux"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.1
          # The task runs in a Swift container; the lint tools aren't needed.
          install: false
      - run: mise run test-linux

  lint:
    name: Lint
    runs-on: tuist-macos-26-3
    if: github.repository == 'tuist/TestCoverageAttribution'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.1
      - run: mise run lint
