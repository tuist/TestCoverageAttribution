name: TestCoverageAttribution

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: test-coverage-attribution-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# The macOS jobs run on Tuist Runners. The `tuist-macos-26-3` profile selects Xcode 26.3 (see
# .xcode-version), so no job switches Xcode itself.
jobs:
  build:
    name: "Release build on macOS"
    runs-on: tuist-macos-26-3
    if: github.repository == 'tuist/TestCoverageAttribution'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.21
      - run: mise run build

  test:
    name: "Test on macOS"
    runs-on: tuist-macos-26-3
    if: github.repository == 'tuist/TestCoverageAttribution'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.21
      - run: mise run test

  # The skip list depends on how each Xcode lists and hands out tests, so it also runs on the
  # oldest Xcode Tuist supports and the newest: hosted unit tests and UI tests on an iOS
  # simulator, serially, in parallel and as a shard. The `test` job covers 26.3.
  test-skip-list:
    name: "Skip list on Xcode ${{ matrix.xcode }}"
    runs-on: ${{ matrix.runner }}
    if: github.repository == 'tuist/TestCoverageAttribution'
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "26.0.1"
            runner: tuist-macos-26-0-1
          - xcode: "27.0"
            runner: tuist-macos-27-0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.21
      - run: mise run test-skip-list

  test-linux:
    name: "Test on Linux"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.21
          # The task runs in a Swift container; the lint tools aren't needed.
          install: false
      - run: mise run test-linux

  lint:
    name: Lint
    runs-on: tuist-macos-26-3
    if: github.repository == 'tuist/TestCoverageAttribution'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.21
      - run: mise run lint
