name: Release

# On every push to main, git-cliff works out whether the conventional commits since the last tag
# make a release. If they do, it updates CHANGELOG.md, commits it as `[Release] <version>`, tags
# that commit and publishes a GitHub release. The push uses GITHUB_TOKEN, which the `main` and tag
# rulesets let bypass them, and doesn't trigger further workflow runs.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'tuist/TestCoverageAttribution' && !startsWith(github.event.head_commit.message, '[Release]')
    env:
      # git-cliff reads pull request numbers and authors from GitHub.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.1
          install_args: git-cliff
      - name: Check whether there are releasable changes
        run: |
          next_version=$(git cliff --bumped-version)
          if git rev-parse "$next_version" >/dev/null 2>&1; then
            echo "Tag $next_version already exists, skipping the release"
            echo "should-release=false" >> "$GITHUB_ENV"
            exit 0
          fi
          bumped=$(git cliff --bump)
          current=$(cat CHANGELOG.md 2>/dev/null || true)
          if [ "$bumped" != "$current" ]; then
            echo "should-release=true" >> "$GITHUB_ENV"
          else
            echo "should-release=false" >> "$GITHUB_ENV"
          fi
      - name: Get the next version
        id: next-version
        if: env.should-release == 'true'
        run: echo "NEXT_VERSION=$(git cliff --bumped-version)" >> "$GITHUB_OUTPUT"
      - name: Get the release notes
        id: release-notes
        if: env.should-release == 'true'
        run: |
          {
            echo "RELEASE_NOTES<<EOF"
            git cliff --unreleased
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Update CHANGELOG.md
        if: env.should-release == 'true'
        run: git cliff --bump -o CHANGELOG.md
      - name: Commit and tag the release
        id: auto-commit-action
        if: env.should-release == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "[Release] TestCoverageAttribution ${{ steps.next-version.outputs.NEXT_VERSION }}"
          commit_options: "--allow-empty"
          skip_dirty_check: true
          tag_name: ${{ steps.next-version.outputs.NEXT_VERSION }}
          tagging_message: ${{ steps.next-version.outputs.NEXT_VERSION }}
      - name: Create the GitHub release
        if: env.should-release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.next-version.outputs.NEXT_VERSION }}
          tag_name: ${{ steps.next-version.outputs.NEXT_VERSION }}
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          target_commitish: ${{ steps.auto-commit-action.outputs.commit_hash }}
